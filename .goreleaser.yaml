version: 2

project_name: gpm

before:
  hooks:
    - go mod tidy

builds:
  - id: gpm
    main: ./cmd/gpm
    binary: gpm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    # Versionless names keep the releases/latest/download/<asset> URLs
    # in install.sh / install.ps1 stable across releases.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
